---
# Redmine create backup data vars

# Host running the database
redmine_db_host: localhost

# Redmine database name
redmine_db_name: redmine

# The password to establish the PostgreSQL session
redmine_db_password: password

# The user name to establish the PostgreSQL session
redmine_db_user: redmine

# ----------------------------------------
# 将来的に実装予定
#
# RDBMSの稼働するするマシンの接続ポート番号
# db_port: 5432
# ----------------------------------------

# Backup data directory
redmine_backup_data_dir: /tmp/redmine-backup

# Archived Git data file
redmine_archived_git_file: git.tar.gz

# Git directories to archive (include list)
#
# You can specify:
# - A "base directory" (e.g. /var/git)
#   -> the role may expand it to its direct subdirectories (implementation-dependent)
# - Specific directories (e.g. /var/git/ansible, /var/git/aws)
#   -> only those directories will be archived
#
# Recommended:
# - For include-only tests: list the exact directories you want (e.g. /var/git/ansible)
# - For exclude tests: include /var/git and exclude some subdirs
redmine_git_include_dirs:
  - /var/git

# Git directories to exclude (exclude list)
#
# Even if a directory is included (directly or by expansion), it will be removed
# from the archive targets when it matches one of these paths.
#
# Notes:
# - Use absolute paths
# - Prefer directory paths without trailing "/" (the role normalizes it, but keep it consistent)
redmine_git_exclude_dirs: []
# Example:
# redmine_git_exclude_dirs:
#   - /var/git/tmp
#   - /var/git/cache

# Archived Redmine media file
redmine_archived_media_file: files.tar.gz

# Redmine media file directory
redmine_file_dir: /var/lib/redmine/files

# PostgreSQL dumped data file
redmine_pg_dump_file: redmine.sql
